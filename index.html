<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Gift Card Service</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b9e 0%, #ff8caf 40%, #ffd085 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #000;
            font-weight: bold;
        }

        .header h2 {
            font-size: 18px;
            margin: 10px 0 15px;
            font-weight: normal;
        }

        .header p {
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 85%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background-color: #d8e0e5;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            color: #000;
        }

        /* ស្ទីលប៊ូតុងទូទៅ */
        button {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            background-color: #d8e0e5;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            color: #000;
        }

        button:active {
            transform: scale(0.95);
        }

        /* ស្ទីលប៊ូតុងពិសេស */
        .btn-dark {
            background-color: #333;
            color: white;
            width: 200px;
        }

        .btn-light {
            background-color: #d8e0e5;
            color: #6a95cc;
            width: 200px;
        }

        .btn-green {
            background-color: #5cb85c;
            color: white;
            font-weight: bold;
            display: none; /* លាក់សិន ពេលកូដចេញទើបបង្ហាញ */
            margin: 10px auto;
            width: 150px;
        }

        .btn-disabled {
            background-color: #e0e0e0 !important;
            color: #b0b0b0 !important;
            cursor: not-allowed;
        }

        .admin-title {
            color: #d32f2f;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* លាក់ផ្ទាំងទី២ និង ទី៣ ពេលបើកដំបូង */
        #screen2, #screen3 {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SEAVLONG OFFICIALS ✔</h1>
            <h2>សេវាកម្មយកកូដថ្មីៗ</h2>
            <p>ROBUX GIFT CARD</p>
        </div>

        <!-- ផ្ទាំងទី១: បញ្ចូល Username -->
        <div id="screen1">
            <div class="form-group">
                <label>សូមបញ្ចូល Username Roblox account របស់អ្នក</label>
                <input type="text" id="username" placeholder="">
            </div>
            <button id="nextBtn">បន្ទាប់ទៀត</button>
        </div>

        <!-- ផ្ទាំងទី២: សម្រាប់អ្នកប្រើប្រាស់ធម្មតាយកកូដ -->
        <div id="screen2">
            <div class="form-group">
                <label>សូមចុចពាក្យ Send code</label>
                <button id="sendBtn">SEND CODE</button>
            </div>
            
            <!-- កន្លែងបង្ហាញកូដ -->
            <div id="codeContainer" style="display: none; margin-top: 30px;">
                <input type="text" id="codeResult" value="" readonly>
                <button id="copyBtn" class="btn-green">COPY កូដ</button>
            </div>
        </div>

        <!-- ផ្ទាំងទី៣: សម្រាប់ Admin លាក់កូដសម្ងាត់ -->
        <div id="screen3">
            <div class="admin-title">🔒 ផ្ទាំងការកំណត់ Admin</div>
            <div class="form-group">
                <label>បញ្ចូលកូដ Robux ថ្មីនៅទីនេះ៖</label>
                <input type="text" id="newAdminCode" placeholder="ROBUX1777&$@">
            </div>
            <button id="saveAdminCodeBtn" class="btn-dark">រក្សាទុកកូដ (Save)</button>
            <br>
            <button id="backToHomeBtn" class="btn-light">ត្រលប់ក្រោយ</button>
        </div>
    </div>

    <script>
        // ទាញយកកូដដែល Admin បាន Save ទុក
        let savedAdminCode = localStorage.getItem('secretRobuxCode') || "ROBUX-0000-0000-0000";

        // ចាប់យក Element
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const usernameInput = document.getElementById('username');
        const nextBtn = document.getElementById('nextBtn');
        const sendBtn = document.getElementById('sendBtn');
        const codeResult = document.getElementById('codeResult');
        const copyBtn = document.getElementById('copyBtn');
        const codeContainer = document.getElementById('codeContainer');
        
        // Admin Elements
        const newAdminCodeInput = document.getElementById('newAdminCode');
        const saveAdminCodeBtn = document.getElementById('saveAdminCodeBtn');
        const backToHomeBtn = document.getElementById('backToHomeBtn');

        // មុខងារពេលចុច "បន្ទាប់ទៀត"
        nextBtn.addEventListener('click', () => {
            const userVal = usernameInput.value.trim();
            
            if (userVal === "") {
                alert("សូមបញ្ចូល Username ជាមុនសិន!");
                return;
            }

            if (userVal === "Longzz@") {
                // ចូលផ្ទាំង Admin
                screen1.style.display = 'none';
                screen3.style.display = 'block';
                newAdminCodeInput.value = savedAdminCode; 
            } else {
                // ចូលផ្ទាំងអ្នកប្រើប្រាស់ធម្មតា
                screen1.style.display = 'none';
                screen2.style.display = 'block';
            }
        });

        // មុខងារ Admin: Save ទុកកូដ
        saveAdminCodeBtn.addEventListener('click', () => {
            const newCode = newAdminCodeInput.value.trim();
            if(newCode !== "") {
                localStorage.setItem('secretRobuxCode', newCode); 
                savedAdminCode = newCode; 
                alert("បានរក្សាទុកកូដសម្ងាត់ដោយជោគជ័យ!");
            } else {
                alert("សូមបញ្ចូលកូដសិនមុននឹង Save!");
            }
        });

        // មុខងារ Admin: ត្រលប់ក្រោយ
        backToHomeBtn.addEventListener('click', () => {
            screen3.style.display = 'none';
            screen1.style.display = 'block';
            usernameInput.value = ""; 
        });

        // មុខងារ User: ចុច SEND CODE
        sendBtn.addEventListener('click', () => {
            // ដូរមុខមាត់ប៊ូតុងទៅជាកំពុងរង់ចាំ
            sendBtn.innerText = "កំពុងទាញយក (5s)...";
            sendBtn.classList.add("btn-disabled");
            sendBtn.disabled = true;

            // រង់ចាំ ៥ វិនាទី
            setTimeout(() => {
                sendBtn.innerText = "ជោគជ័យ"; // ដូរអក្សរទៅជា ជោគជ័យ ដូចក្នុងរូបភាពទី២
                codeContainer.style.display = 'block'; // បង្ហាញប្រអប់កូដ និងប៊ូតុង Copy
                codeResult.value = savedAdminCode; // លោតកូដដែល Admin បាន Save
                copyBtn.style.display = 'block';
            }, 5000);
        });

        // មុខងារ User: ចុច COPY កូដ
        copyBtn.addEventListener('click', () => {
            codeResult.select();
            codeResult.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(codeResult.value).then(() => {
                alert("បាន Copy កូដដោយជោគជ័យ!");
            }).catch(err => {
                alert("បរាជ័យក្នុងការ Copy");
            });
        });
    </script>

</body>
</html>
