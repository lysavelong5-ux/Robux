<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Gift Card Service</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b9e 0%, #ff8caf 40%, #ffd085 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #000;
            font-weight: bold;
        }

        .header h2 {
            font-size: 18px;
            margin: 10px 0 15px;
            font-weight: normal;
        }

        .header p {
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* ========== កន្លែងរចនាប្រអប់ Username បែប 3D និងភ្លើង RGB ========== */
        
        /* តំឡើងចលនាភ្លើង RGB */
        @keyframes rgbGlow {
            0% { box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 15px #ff0000, inset 0 0 10px #ff0000; border-color: #ff0000; }
            33% { box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 15px #00ff00, inset 0 0 10px #00ff00; border-color: #00ff00; }
            66% { box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 15px #0000ff, inset 0 0 10px #0000ff; border-color: #0000ff; }
            100% { box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 15px #ff0000, inset 0 0 10px #ff0000; border-color: #ff0000; }
        }

        #username {
            width: 85%;
            padding: 15px;
            border-radius: 25px;
            border: 2px solid transparent; /* ទុកចន្លោះឲ្យភ្លើង RGB */
            background-color: #ffffff;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            color: #000;
            
            /* រចនាបែប 3D ផុសឡើងលើ */
            transform: translateY(-5px);
            transition: all 0.3s ease;
            
            /* ដំណើរការភ្លើង RGB */
            animation: rgbGlow 3s linear infinite;
        }

        /* ពេលចុច (Focus) លើប្រអប់ វានឹងផុសលោតឡើងលើថែមទៀត */
        #username:focus {
            transform: translateY(-12px) scale(1.05);
            background-color: #f8f9fa;
        }
        
        /* ========================================================= */

        input[type="text"]:not(#username) {
            width: 85%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background-color: #d8e0e5;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            color: #000;
        }

        /* ស្ទីលប៊ូតុងទូទៅ */
        button {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            background-color: #d8e0e5;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            color: #000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.95);
        }

        /* ស្ទីលប៊ូតុងពិសេស */
        .btn-dark {
            background-color: #333;
            color: white;
            width: 200px;
        }

        .btn-light {
            background-color: #d8e0e5;
            color: #6a95cc;
            width: 200px;
        }

        .btn-green {
            background-color: #5cb85c;
            color: white;
            font-weight: bold;
            display: none;
            margin: 15px auto;
            width: 150px;
            box-shadow: 0 5px 15px rgba(92, 184, 92, 0.4);
        }

        .btn-disabled {
            background-color: #e0e0e0 !important;
            color: #b0b0b0 !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .admin-title {
            color: #d32f2f;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #screen2, #screen3 {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SEAVLONG OFFICIALS ✔</h1>
            <h2>សេវាកម្មយកកូដថ្មីៗ</h2>
            <p>ROBUX GIFT CARD</p>
        </div>

        <!-- ផ្ទាំងទី១: បញ្ចូល Username -->
        <div id="screen1">
            <div class="form-group">
                <label>សូមបញ្ចូល Username Roblox account របស់អ្នក</label>
                <input type="text" id="username" placeholder="បញ្ចូលឈ្មោះទីនេះ">
            </div>
            <button id="nextBtn">បន្ទាប់ទៀត</button>
        </div>

        <!-- ផ្ទាំងទី២: សម្រាប់អ្នកប្រើប្រាស់ធម្មតាយកកូដ -->
        <div id="screen2">
            <div class="form-group">
                <label>សូមចុចពាក្យ Send code</label>
                <button id="sendBtn">SEND CODE</button>
            </div>
            
            <div id="codeContainer" style="display: none; margin-top: 30px;">
                <input type="text" id="codeResult" value="" readonly>
                <button id="copyBtn" class="btn-green">COPY កូដ</button>
            </div>
        </div>

        <!-- ផ្ទាំងទី៣: សម្រាប់ Admin លាក់កូដសម្ងាត់ -->
        <div id="screen3">
            <div class="admin-title">🔒 ផ្ទាំងការកំណត់ Admin</div>
            <div class="form-group">
                <label>បញ្ចូលកូដ Robux ថ្មីនៅទីនេះ៖</label>
                <input type="text" id="newAdminCode" placeholder="ROBUX1777&$@">
            </div>
            <button id="saveAdminCodeBtn" class="btn-dark">រក្សាទុកកូដ (Save)</button>
            <br>
            <button id="backToHomeBtn" class="btn-light">ត្រលប់ក្រោយ</button>
        </div>
    </div>

    <script>
        let savedAdminCode = localStorage.getItem('secretRobuxCode') || "ROBUX-0000-0000-0000";

        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const usernameInput = document.getElementById('username');
        const nextBtn = document.getElementById('nextBtn');
        const sendBtn = document.getElementById('sendBtn');
        const codeResult = document.getElementById('codeResult');
        const copyBtn = document.getElementById('copyBtn');
        const codeContainer = document.getElementById('codeContainer');
        
        const newAdminCodeInput = document.getElementById('newAdminCode');
        const saveAdminCodeBtn = document.getElementById('saveAdminCodeBtn');
        const backToHomeBtn = document.getElementById('backToHomeBtn');

        nextBtn.addEventListener('click', () => {
            const userVal = usernameInput.value.trim();
            
            if (userVal === "") {
                alert("សូមបញ្ចូល Username ជាមុនសិន!");
                return;
            }

            if (userVal === "Longzz@") {
                screen1.style.display = 'none';
                screen3.style.display = 'block';
                newAdminCodeInput.value = savedAdminCode; 
            } else {
                screen1.style.display = 'none';
                screen2.style.display = 'block';
            }
        });

        saveAdminCodeBtn.addEventListener('click', () => {
            const newCode = newAdminCodeInput.value.trim();
            if(newCode !== "") {
                localStorage.setItem('secretRobuxCode', newCode); 
                savedAdminCode = newCode; 
                alert("បានរក្សាទុកកូដសម្ងាត់ដោយជោគជ័យ!");
            } else {
                alert("សូមបញ្ចូលកូដសិនមុននឹង Save!");
            }
        });

        backToHomeBtn.addEventListener('click', () => {
            screen3.style.display = 'none';
            screen1.style.display = 'block';
            usernameInput.value = ""; 
        });

        sendBtn.addEventListener('click', () => {
            sendBtn.innerText = "កំពុងទាញយក (5s)...";
            sendBtn.classList.add("btn-disabled");
            sendBtn.disabled = true;

            setTimeout(() => {
                sendBtn.innerText = "ជោគជ័យ";
                codeContainer.style.display = 'block';
                codeResult.value = savedAdminCode; 
                copyBtn.style.display = 'block';
            }, 5000);
        });

        copyBtn.addEventListener('click', () => {
            codeResult.select();
            codeResult.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(codeResult.value).then(() => {
                alert("បាន Copy កូដដោយជោគជ័យ!");
            }).catch(err => {
                alert("បរាជ័យក្នុងការ Copy");
            });
        });
    </script>

</body>
</html>
